<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hermes/upload-multiple — drop zone</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main>
        <h1>🪄 hermes/upload-multiple</h1>
        <p class="subtitulo">Arraste as imagens para a área abaixo (drop zone) ou clique para selecionar.</p>

        <form id="form">
            <div id="dropzone" class="dropzone" tabindex="0">
                <div class="dropzone-icone">⬇️</div>
                <p><strong>Arraste as imagens aqui</strong></p>
                <p class="dropzone-dica">ou clique para escolher (várias de uma vez)</p>
            </div>
            <input type="file" id="arquivos" name="fotos[]" multiple accept="image/*" hidden>

            <div id="lista" class="lista"></div>

            <button type="submit" id="enviar" disabled>Enviar imagens</button>
            <p id="status" class="status"></p>
        </form>

        <div id="resultado" class="resultado" hidden>
            <h2>Resultado</h2>
            <div id="resultado-corpo"></div>
        </div>
    </main>

    <script>
        // ===== drop zone em JS puro (zero dependencias) =====
        const zona = document.getElementById('dropzone');
        const input = document.getElementById('arquivos');
        const lista = document.getElementById('lista');
        const enviar = document.getElementById('enviar');
        const status = document.getElementById('status');

        // clique na zona abre o seletor
        zona.addEventListener('click', () => input.click());
        zona.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
        });

        // arrastar por cima: destaca a zona
        zona.addEventListener('dragover', (e) => {
            e.preventDefault();
            zona.classList.add('sobre');
        });
        zona.addEventListener('dragleave', () => zona.classList.remove('sobre'));

        // soltou: recebe os arquivos
        zona.addEventListener('drop', (e) => {
            e.preventDefault();
            zona.classList.remove('sobre');
            input.files = e.dataTransfer.files;
            mostraPreviews();
        });

        input.addEventListener('change', mostraPreviews);

        // previews (object URLs — sem upload ainda)
        function mostraPreviews() {
            lista.innerHTML = '';
            for (const f of input.files) {
                const item = document.createElement('div');
                item.className = 'item';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(f);
                img.alt = f.name;
                const info = document.createElement('div');
                info.className = 'item-info';
                info.textContent = `${f.name} · ${(f.size / 1024).toFixed(0)} KB`;
                item.append(img, info);
                lista.append(item);
            }
            enviar.disabled = input.files.length === 0;
            status.textContent = '';
        }

        // envia tudo (FormData) e mostra o resultado
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (input.files.length === 0) return;

            status.textContent = 'Enviando...';
            enviar.disabled = true;

            const fd = new FormData();
            for (const f of input.files) fd.append('fotos[]', f);

            try {
                const resp = await fetch('upload.php', { method: 'POST', body: fd });
                const dados = await resp.json();

                const corpo = document.getElementById('resultado-corpo');
                corpo.innerHTML = '';

                if (dados.total > 0) {
                    const ok = document.createElement('p');
                    ok.className = 'ok';
                    ok.textContent = `✅ ${dados.total} arquivo(s) enviado(s) e registrado(s).`;
                    corpo.append(ok);

                    const grade = document.createElement('div');
                    grade.className = 'grade';
                    for (const r of dados.registros) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        const img = document.createElement('img');
                        // mostra o webp se existir, senao o original
                        img.src = r.webp || r.caminho;
                        img.alt = r.nome_original;
                        card.append(img);
                        const legenda = document.createElement('div');
                        legenda.className = 'card-legenda';
                        legenda.textContent = `${r.nome_original} → #${r.id}${r.imagem_id ? ' (img ' + r.imagem_id + ')' : ''}`;
                        card.append(legenda);
                        grade.append(card);
                    }
                    corpo.append(grade);
                }

                const erros = Object.entries(dados.erros || {});
                if (erros.length > 0) {
                    const ul = document.createElement('ul');
                    ul.className = 'erros';
                    for (const [nome, msg] of erros) {
                        const li = document.createElement('li');
                        li.textContent = `${nome}: ${msg}`;
                        ul.append(li);
                    }
                    corpo.append(ul);
                }

                document.getElementById('resultado').hidden = false;
                status.textContent = '';
            } catch (err) {
                status.textContent = 'Erro ao enviar: ' + err.message;
            } finally {
                enviar.disabled = false;
            }
        });
    </script>
</body>
</html>
